name: iOS Simulator preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-simulator-preview-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build iOS Simulator app
    runs-on: macos-15
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.EXPO_PUBLIC_API_URL }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check preview API URL
        run: |
          if [ -z "$EXPO_PUBLIC_API_URL" ]; then
            echo "::error::Set the repository Actions variable EXPO_PUBLIC_API_URL to the reachable WidgetComposer API URL."
            exit 1
          fi

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --no-install

      - name: Install CocoaPods dependencies
        run: |
          cd ios
          pod install

      - name: Build for iOS Simulator
        run: |
          xcodebuild \
            -workspace ios/web2widgets.xcworkspace \
            -scheme web2widgets \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package Simulator app
        run: |
          APP_PATH="ios/build/Build/Products/Debug-iphonesimulator/web2widgets.app"
          test -d "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" ios-simulator-preview.zip

      - name: Upload Simulator app
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-preview-${{ github.event.pull_request.number || github.run_number }}
          path: ios-simulator-preview.zip
          if-no-files-found: error
          retention-days: 14
